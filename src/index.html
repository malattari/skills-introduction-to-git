<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Todo Tracker</h1>
      <form id="todoForm" class="todo-form">
        <label for="todoInput" class="sr-only">New todo item</label>
        <input id="todoInput" type="text" placeholder="Add a todo item" required />
        <button type="submit">Add</button>
      </form>

      <ul id="todoList" class="todo-list" aria-live="polite"></ul>
    </main>

    <script src="index.js"></script>
  </body>
</html>
